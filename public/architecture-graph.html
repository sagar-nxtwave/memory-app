<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory App — Architecture Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1117; color: #e0e0e0; overflow: hidden; }
  canvas { display: block; }
  #legend {
    position: fixed; top: 16px; right: 16px; background: rgba(20,22,30,0.95);
    border: 1px solid #2a2d3a; border-radius: 10px; padding: 14px 18px; font-size: 12px;
    z-index: 10; backdrop-filter: blur(8px);
  }
  #legend h3 { font-size: 13px; margin-bottom: 8px; color: #fff; letter-spacing: 0.5px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  #title {
    position: fixed; top: 16px; left: 16px; z-index: 10;
  }
  #title h1 { font-size: 20px; color: #fff; font-weight: 700; letter-spacing: -0.3px; }
  #title p { font-size: 12px; color: #888; margin-top: 2px; }
  #tooltip {
    position: fixed; display: none; background: rgba(20,22,30,0.97); border: 1px solid #4a90d9;
    border-radius: 8px; padding: 10px 14px; font-size: 12px; max-width: 320px;
    pointer-events: none; z-index: 100; backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #tooltip .tt-title { font-weight: 700; color: #4a90d9; margin-bottom: 4px; font-size: 13px; }
  #tooltip .tt-desc { color: #bbb; line-height: 1.5; }
  #tooltip .tt-files { color: #888; font-size: 11px; margin-top: 6px; font-style: italic; }
  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px;
  }
  #controls button {
    background: rgba(30,33,44,0.9); border: 1px solid #2a2d3a; color: #ccc;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    transition: all 0.2s;
  }
  #controls button:hover { background: #2a2d3a; color: #fff; border-color: #4a90d9; }
</style>
</head>
<body>
<canvas id="graph"></canvas>
<div id="title">
  <h1>Memory App — System Architecture</h1>
  <p>AI Executive Intelligence for Real-Estate • Next.js 16 + PostgreSQL + OpenRouter + Pinecone</p>
</div>
<div id="legend">
  <h3>LEGEND</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div> Frontend (React / Next.js)</div>

  <div class="legend-item"><div class="legend-dot" style="background:#e8a838"></div> AI / LLM Layer</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d94a6a"></div> Salesforce Module</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b07fd8"></div> Data / Storage</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5ec4d9"></div> External Services</div>
</div>
<div id="tooltip">
  <div class="tt-title"></div>
  <div class="tt-desc"></div>
  <div class="tt-files"></div>
</div>
<div id="controls">
  <button onclick="resetView()">Reset View</button>
  <button onclick="toggleLabels()">Toggle Labels</button>
  <button onclick="toggleAnimation()">Pause / Play</button>
</div>

<script>
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let W, H, dpr;
let showLabels = true;
let animating = true;
let frame = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const categories = {
  frontend: '#4a90d9',
  api: '#50c878',
  ai: '#e8a838',
  sf: '#d94a6a',
  data: '#b07fd8',
  ext: '#5ec4d9',

  { id: 'auth', label: 'Auth UI', x: 0.18, y: 0.58, r: 22, cat: 'frontend',

  { id: 'chat-api', label: '/api/chat', x: 0.42, y: 0.14, r: 30, cat: 'api',

  { id: 'gchat-api', label: '/api/global-chat', x: 0.56, y: 0.14, r: 30, cat: 'api',

    files: 'src/app/api/global-chat/route.ts' },
  { id: 'docs-api', label: '/api/documents', x: 0.42, y: 0.28, r: 28, cat: 'api',
    desc: 'Upload → presign → confirm → process pipeline with presigned S3 URLs',
    files: 'src/app/api/documents/route.ts, presign, confirm, text' },
  { id: 'sf-api', label: '/api/salesforce', x: 0.56, y: 0.28, r: 28, cat: 'api',
    desc: 'RAG indexing endpoint + MCP OAuth callback',
    files: 'src/app/api/salesforce/rag-index, mcp-oauth-callback' },
  { id: 'settings-api', label: '/api/settings', x: 0.49, y: 0.42, r: 26, cat: 'api',
    desc: 'CRUD for glossary terms, skill files, synonyms',
    files: 'src/app/api/settings/glossary, skill-files, synonyms' },
  { id: 'auth-api', label: '/api/auth', x: 0.42, y: 0.56, r: 24, cat: 'api',

  { id: 'sf-guard', label: 'Guardrails', x: 0.18, y: 0.96, r: 24, cat: 'sf',

  { id: 'sf-verify', label: 'Answer Verifier', x: 0.34, y: 0.78, r: 26, cat: 'sf',

  { id: 'sf-meta', label: 'Metadata Graph', x: 0.34, y: 0.92, r: 24, cat: 'sf',

  { id: 'postgres', label: 'PostgreSQL (Neon)', x: 0.62, y: 0.72, r: 34, cat: 'data',

  { id: 'pinecone', label: 'Pinecone', x: 0.78, y: 0.72, r: 28, cat: 'data',

  { id: 's3', label: 'S3 Storage', x: 0.62, y: 0.88, r: 26, cat: 'data',

    files: 'src/lib/storage/minio.ts, src/app/api/documents/presign' },
  { id: 'drizzle', label: 'Drizzle ORM', x: 0.78, y: 0.88, r: 24, cat: 'data',
    desc: 'Type-safe SQL queries, migrations, schema management',
    files: 'src/lib/db/index.ts, drizzle/*.sql' },

  { id: 'sf-crm', label: 'Salesforce CRM', x: 0.50, y: 0.92, r: 30, cat: 'ext',
    desc: 'Production Salesforce org — REST API + SOQL + Streaming API',
    files: 'src/salesforce/client.ts, config.ts' },
  { id: 'tavily', label: 'Tavily Search', x: 0.92, y: 0.56, r: 24, cat: 'ext',
    desc: 'Web search API for real-time context augmentation',
    files: 'src/web-search/tavily.ts, search.ts' },
  { id: 'openrouter', label: 'OpenRouter API', x: 0.92, y: 0.42, r: 26, cat: 'ext',
    desc: 'Unified LLM gateway — Claude, GPT-4o, Gemini, Mistral',
    files: 'src/lib/ai/provider.ts, models.ts' },
];

const edges = [
  { from: 'chat-panel', to: 'chat-api', label: 'SSE stream' },
  { from: 'global-chat', to: 'gchat-api', label: 'SSE stream' },
  { from: 'docs-ui', to: 'docs-api', label: 'upload' },
  { from: 'settings', to: 'settings-api', label: 'CRUD' },
  { from: 'auth', to: 'auth-api', label: 'login' },
  { from: 'ui', to: 'chat-api' },
  { from: 'ui', to: 'gchat-api' },
  { from: 'ui', to: 'misc-api', label: 'spaces, catch-up...' },

  { from: 'chat-api', to: 'intent', label: 'classify' },
  { from: 'gchat-api', to: 'intent', label: 'classify' },
  { from: 'chat-api', to: 'processing', label: 'docs' },
  { from: 'gchat-api', to: 'sf-query', label: 'CRM' },
  { from: 'docs-api', to: 'processing', label: 'process' },
  { from: 'sf-api', to: 'sf-rag', label: 'index' },

  { from: 'intent', to: 'llm', label: 'chat' },
  { from: 'intent', to: 'cohere', label: 'rerank' },
  { from: 'processing', to: 'embeddings', label: 'embed' },
  { from: 'processing', to: 'ocr', label: 'OCR' },
  { from: 'prompts', to: 'intent' },
  { from: 'prompts', to: 'llm' },

  { from: 'processing', to: 'postgres', label: 'store chunks' },
  { from: 'processing', to: 's3', label: 'images' },

  { from: 'sf-query', to: 'sf-mcp', label: '70+ tools' },
  { from: 'sf-query', to: 'sf-rag', label: 'vector search' },
  { from: 'sf-query', to: 'sf-verify', label: 'validate' },
  { from: 'sf-query', to: 'sf-guard', label: 'sanitize' },
  { from: 'sf-query', to: 'sf-meta', label: 'schema' },
  { from: 'sf-mcp', to: 'sf-crm', label: 'REST API' },
  { from: 'sf-query', to: 'sf-crm', label: 'SOQL' },
  { from: 'sf-rag', to: 'pinecone' },

  { from: 'postgres', to: 'drizzle' },
  { from: 'docs-api', to: 's3', label: 'presign' },
  { from: 'auth-api', to: 'postgres', label: 'users' },
  { from: 'settings-api', to: 'postgres', label: 'glossary' },

  { from: 'llm', to: 'openrouter', label: 'API' },
  { from: 'embeddings', to: 'openrouter', label: 'API' },
  { from: 'intent', to: 'tavily', label: 'web search' },
  { from: 'gchat-api', to: 'tavily', label: 'web search' },
];

function getNodePos(n) { return { x: n.x * W, y: n.y * H }; }

function drawEdge(e, t) {
  const fn = nodes.find(n => n.id === e.from);
  const tn = nodes.find(n => n.id === e.to);
  if (!fn || !tn) return;
  const fp = getNodePos(fn), tp = getNodePos(tn);
  const dx = tp.x - fp.x, dy = tp.y - fp.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 1) return;
  const nx = dx/dist, ny = dy/dist;
  const sx = fp.x + nx * fn.r, sy = fp.y + ny * fn.r;
  const ex = tp.x - nx * tn.r, ey = tp.y - ny * tn.r;

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.strokeStyle = 'rgba(100,110,140,0.25)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([6, 4]);
  ctx.lineDashOffset = -t * 0.3;
  ctx.stroke();
  ctx.setLineDash([]);

  const aLen = 7, aW = 3.5;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - nx*aLen + ny*aW, ey - ny*aLen - nx*aW);
  ctx.lineTo(ex - nx*aLen - ny*aW, ey - ny*aLen + nx*aW);
  ctx.closePath();
  ctx.fillStyle = 'rgba(100,110,140,0.35)';
  ctx.fill();
}

function drawNode(n, t) {
  const p = getNodePos(n);
  const col = categories[n.cat];
  const pulse = 1 + 0.02 * Math.sin(t * 0.02 + n.x * 10);
  const r = n.r * pulse;

  const grad = ctx.createRadialGradient(p.x, p.y, r*0.3, p.x, p.y, r*1.6);
  grad.addColorStop(0, col + '30');
  grad.addColorStop(1, col + '00');
  ctx.beginPath();
  ctx.arc(p.x, p.y, r*1.6, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI*2);
  ctx.fillStyle = col + '18';
  ctx.fill();
  ctx.strokeStyle = col + 'aa';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  if (showLabels) {
    ctx.fillStyle = '#e0e0e0';
    ctx.font = `600 ${Math.max(10, r*0.32)}px 'Segoe UI', system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const words = n.label.split(' ');
    if (words.length > 2 && r < 30) {
      const mid = Math.ceil(words.length/2);
      ctx.fillText(words.slice(0,mid).join(' '), p.x, p.y - r*0.18);
      ctx.fillText(words.slice(mid).join(' '), p.x, p.y + r*0.18);
    } else {
      ctx.fillText(n.label, p.x, p.y);
    }
  }
}

function render() {
  if (animating) frame++;
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(50,55,70,0.12)';
  ctx.lineWidth = 0.5;
  const gridSize = 60;
  for (let x = 0; x < W; x += gridSize) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += gridSize) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  edges.forEach(e => drawEdge(e, frame));
  nodes.forEach(n => drawNode(n, frame));
  requestAnimationFrame(render);
}
render();

canvas.addEventListener('mousemove', (ev) => {
  const mx = ev.clientX, my = ev.clientY;
  let hit = null;
  for (const n of nodes) {
    const p = getNodePos(n);
    const dx = mx - p.x, dy = my - p.y;
    if (dx*dx + dy*dy < n.r*n.r*1.3) { hit = n; break; }
  }
  if (hit) {
    tooltip.style.display = 'block';
    tooltip.style.left = (mx + 16) + 'px';
    tooltip.style.top = (my - 10) + 'px';
    tooltip.querySelector('.tt-title').textContent = hit.label;
    tooltip.querySelector('.tt-desc').textContent = hit.desc;
    tooltip.querySelector('.tt-files').textContent = hit.files;
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

function resetView() { resize(); }
function toggleLabels() { showLabels = !showLabels; }
function toggleAnimation() { animating = !animating; }
</script>
</body>
</html>
